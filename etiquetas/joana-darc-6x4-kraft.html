<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Cinzel:wght@600;700&family=IM+Fell+English:ital@0;1&display=swap" rel="stylesheet">
<style>
html,body{margin:0}
.c{width:600px;height:400px;position:relative;overflow:hidden;box-sizing:border-box;background:#fff}
.b1{position:absolute;inset:6px;border:4px solid #2a1a10;border-radius:14px}
.b2{position:absolute;inset:16px;border:1.5px solid #2a1a10;border-radius:9px}
.corner{position:absolute;width:22px;height:22px;color:#2a1a10}
svg.santa{position:absolute;left:26px;top:22px;height:356px}
.t{position:absolute;left:262px;right:26px;top:0;bottom:0;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;color:#2a1a10}
.f1{font-family:'Cinzel Decorative',serif;font-weight:700;font-size:38px;line-height:1.05;color:#2a1a10}
.orn{margin:12px 0 10px;display:flex;align-items:center;gap:8px}
.orn i{display:block;width:62px;height:1.6px;background:#2a1a10}
.f2{font-family:'Cinzel',serif;font-weight:700;font-size:23px;line-height:1.2;letter-spacing:.5px}
.f3{margin-top:14px;font-family:'IM Fell English',serif;font-style:italic;font-size:27px;color:#2a1a10}
.f4{font-family:'IM Fell English',serif;font-style:italic;font-size:15px;color:#2a1a10;margin-top:2px}
</style></head><body><div class="c"><div class="b1"></div><div class="b2"></div>
<svg class="santa" viewBox="0 0 230 360">
 <defs><pattern id="hatch" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="5" stroke="#2a1a10" stroke-width="1.1"/></pattern>
  <pattern id="dots" width="6" height="6" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r="1" fill="#2a1a10"/></pattern></defs>
 <g stroke="#2a1a10" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round">
  <!-- estandarte -->
  <line x1="190" y1="20" x2="190" y2="345" stroke-width="5" stroke="#2a1a10"/>
  <circle cx="190" cy="16" r="5" fill="#2a1a10"/>
  <path d="M190,30 L120,34 C114,60 118,88 124,110 L190,104 Z" fill="#fff"/>
  <path d="M156,52 c-6,8 -6,18 0,24 c6,-6 6,-16 0,-24 Z M146,70 c4,-2 16,-2 20,0 M147,74 q-6,6 -1,12 q4,-3 6,-8 M165,74 q6,6 1,12 q-4,-3 -6,-8 M156,76 v14" fill="#2a1a10" stroke-width="1.6"/>
  <!-- auréola -->
  <circle cx="98" cy="70" r="44" fill="#fff" stroke="#2a1a10"/>
  <!-- capa -->
  <path d="M48,150 C30,220 22,300 18,350 L178,350 C172,300 162,220 148,150 Z" fill="url(#hatch)"/>
  <!-- túnica / armadura do corpo -->
  <path d="M62,140 C56,190 54,250 50,350 L146,350 C142,250 140,190 134,140 Z" fill="#fff"/>
  <path d="M60,200 L136,200 M56,232 L140,232" stroke-width="1.6"/>
  <!-- sobreveste azul com flor-de-lis -->
  <path d="M72,236 L124,236 L134,350 L62,350 Z" fill="url(#dots)"/>
  <path d="M98,272 c-5,7 -5,15 0,20 c5,-5 5,-13 0,-20 Z M90,288 c3,-2 13,-2 16,0 M91,291 q-5,5 -1,10 q3,-2 5,-7 M105,291 q5,5 1,10 q-3,-2 -5,-7" fill="#2a1a10" stroke-width="1.4"/>
  <!-- cinto -->
  <rect x="58" y="226" width="80" height="11" rx="3" fill="#2a1a10"/>
  <rect x="91" y="225" width="14" height="13" rx="2" fill="#fff"/>
  <!-- ombreiras -->
  <path d="M44,148 C52,126 78,124 86,138 C80,158 56,166 44,148 Z" fill="#fff"/>
  <path d="M152,148 C144,126 118,124 110,138 C116,158 140,166 152,148 Z" fill="#fff"/>
  <!-- pescoço e cabeça -->
  <path d="M88,118 L108,118 L106,136 L90,136 Z" fill="#fff"/>
  <ellipse cx="98" cy="92" rx="25" ry="30" fill="#fff"/>
  <!-- cabelo curto (corte medieval) -->
  <path d="M72,96 C66,62 82,52 98,52 C116,52 132,62 124,96 C122,82 116,72 110,70 C100,78 86,78 76,72 C74,80 73,88 72,96 Z" fill="#2a1a10"/>
  <path d="M72,96 C74,108 76,114 80,118 M124,96 C122,108 120,114 116,118" fill="none" stroke="#2a1a10" stroke-width="4"/>
  <!-- rosto -->
  <path d="M86,92 q4,-3 8,0 M102,92 q4,-3 8,0" fill="none" stroke-width="1.8"/>
  <path d="M98,96 q-2,8 1,10" fill="none" stroke-width="1.4"/>
  <path d="M92,110 q6,4 12,0" fill="none" stroke="#2a1a10" stroke-width="2"/>
  <!-- braços e mãos segurando o estandarte -->
  <path d="M146,152 C160,168 170,176 182,178" fill="none" stroke="#2a1a10" stroke-width="17"/><path d="M146,152 C160,168 170,176 182,178" fill="none" stroke="#fff" stroke-width="12"/>
  
  <circle cx="188" cy="178" r="8" fill="#fff"/>
  <path d="M50,152 C46,180 60,198 84,200" fill="none" stroke="#2a1a10" stroke-width="17"/><path d="M50,152 C46,180 60,198 84,200" fill="none" stroke="#fff" stroke-width="12"/>
  <!-- espada -->
  <line x1="84" y1="196" x2="84" y2="340" stroke="#2a1a10" stroke-width="5"/>
  <line x1="70" y1="198" x2="98" y2="198" stroke="#2a1a10" stroke-width="5"/>
  <circle cx="84" cy="188" r="6" fill="#2a1a10"/>
  <circle cx="86" cy="202" r="8" fill="#fff"/>
 </g>
</svg>
<div class="t">
 <div class="f1">Feira<br>Medieval</div>
 <div class="orn"><i></i><svg width="18" height="20" viewBox="0 0 18 20"><path d="M9,1 c-5,6 -5,12 0,15 c5,-3 5,-9 0,-15 Z M2,12 c3,-1.5 11,-1.5 14,0 M3,14 q-3,3 0,6 q2,-1 3,-4 M15,14 q3,3 0,6 q-2,-1 -3,-4" fill="#2a1a10" stroke="#2a1a10" stroke-width=".8"/></svg><i></i></div>
 <div class="f2">Colégio<br>Santo Afonso</div>
 <div class="f3">Pedro – 3º ano C</div>
 <div class="f4">Santa Joana d’Arc</div>
</div></div></body></html>
