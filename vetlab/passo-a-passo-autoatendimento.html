<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0}
.p{width:1123px;height:794px;background:#fff;font-family:Inter,sans-serif;color:#2b1a1a;position:relative;box-sizing:border-box;padding:22px 34px}
.top{display:flex;align-items:center;justify-content:center;gap:34px}
.logo{height:118px}
.ttl{text-align:left}

.card svg.ill{width:256px;height:256px}
.cap{margin-top:14px;text-align:center;font-weight:900;font-size:31px;line-height:1.12;color:#8b1414}
.hint{margin-top:8px;text-align:center;font-size:20px;font-weight:600;line-height:1.25;color:#4a3030}
.arr{flex:none;width:96px;height:96px}
.foot{position:absolute;left:0;right:0;bottom:16px;text-align:center;font-size:26px;font-weight:900;color:#2f8a3f}
