<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;background:#f6f1ea}
svg{display:block}
text{font-family:Inter,sans-serif}
</style></head><body>
<svg width="1080" height="1350" viewBox="0 0 1080 1350" xmlns="http://www.w3.org/2000/svg">
<defs>
  <marker id="ar" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#c0612b"/></marker>
  <g id="nb">
    <rect x="208" y="8" width="16" height="276" rx="4" fill="#f4ecdc" stroke="#cdb894" stroke-width="2"/>
    <line x1="212" y1="20" x2="212" y2="272" stroke="#e2d5bb"/><line x1="217" y1="20" x2="217" y2="272" stroke="#e2d5bb"/>
    <rect x="0" y="0" width="215" height="292" rx="10" fill="#d9c19e" stroke="#b5966b" stroke-width="2"/>
    <rect x="11" y="11" width="193" height="270" rx="6" fill="none" stroke="#a4845a" stroke-width="1.6" stroke-dasharray="6 5"/>
  </g>
  <g id="pen">
    <rect x="-8" y="62" width="16" height="150" rx="3" fill="#e9f0f4" stroke="#8fa0aa" stroke-width="1.5"/>
    <rect x="-2" y="70" width="4" height="125" fill="#333" opacity=".75"/>
    <path d="M-8,210 L8,210 L4,232 L-4,232 z" fill="#1d1d1d"/>
    <rect x="-10" y="0" width="20" height="66" rx="7" fill="#1d1d1d"/>
    <rect x="7" y="8" width="7" height="46" rx="3" fill="#1d1d1d"/>
    <rect x="-5" y="6" width="3" height="52" rx="1.5" fill="#fff" opacity=".25"/>
  </g>
  <g id="band">
    <rect x="0" y="0" width="100" height="62" rx="6" fill="#262626"/>
    <path d="M64,47 C46,36 42,28 45,21 C48,14 58,14 64,22 C70,14 80,14 83,21 C86,28 82,36 64,47 z" fill="#d9c19e"/>
  </g>
  <g id="loop">
    <rect x="-17" y="-7" width="34" height="76" rx="9" fill="#141414"/>
    <rect x="-11" y="-3" width="4" height="68" rx="2" fill="#fff" opacity=".18"/>
  </g>
</defs>

<text x="540" y="92" text-anchor="middle" font-size="58" font-weight="800" fill="#3b2a1f">Como usar o</text>
<text x="540" y="160" text-anchor="middle" font-size="58" font-weight="800" fill="#a0522d">Suporte para Caneta</text>
<text x="540" y="202" text-anchor="middle" font-size="24" fill="#6b5847">Em 4 passos, sua caneta fica sempre presa na agenda</text>

<!-- cards -->
<g font-size="27" font-weight="700" fill="#3b2a1f">
<g transform="translate(50,235)">
  <rect width="475" height="480" rx="28" fill="#fff" stroke="#e7dccd" stroke-width="2"/>
  <circle cx="48" cy="48" r="27" fill="#a0522d"/><text x="48" y="58" text-anchor="middle" fill="#fff" font-size="28">1</text>
  <text x="90" y="56" font-size="18" font-weight="500" fill="#8a7765">vista de cima</text>
  <!-- corte: capa e miolo -->
  <rect x="40" y="200" width="270" height="70" rx="4" fill="#f4ecdc" stroke="#cdb894" stroke-width="2"/>
  <line x1="40" y1="215" x2="300" y2="215" stroke="#e2d5bb"/><line x1="40" y1="235" x2="300" y2="235" stroke="#e2d5bb"/><line x1="40" y1="255" x2="300" y2="255" stroke="#e2d5bb"/>
  <rect x="40" y="180" width="285" height="16" rx="3" fill="#b5966b"/>
  <rect x="40" y="274" width="285" height="16" rx="3" fill="#b5966b"/>
  <!-- suporte em U -->
  <path d="M440,166 L360,166 Q346,166 346,180 L346,196 Q346,210 360,210 L440,210 L440,200 L362,200 Q356,200 356,194 L356,182 Q356,176 362,176 L440,176 z" fill="#262626" transform="translate(-6,0)"/>
  <circle cx="400" cy="146" r="17" fill="none" stroke="#141414" stroke-width="9"/>
  <path d="M330,120 L262,120" stroke="#c0612b" stroke-width="7" marker-end="url(#ar)"/>
  <text x="70" y="170" font-size="19" font-weight="600" fill="#8a6a45">capa</text>
  <text x="372" y="245" font-size="19" font-weight="600" fill="#3b2a1f">suporte</text>
  <text x="40" y="365">Encaixe o suporte</text>
  <text x="40" y="400">na borda da capa,</text>
  <text x="40" y="435" font-weight="500" font-size="23" fill="#6b5847">com o anel virado para fora.</text>
</g>

<g transform="translate(555,235)">
  <rect width="475" height="480" rx="28" fill="#fff" stroke="#e7dccd" stroke-width="2"/>
  <circle cx="48" cy="48" r="27" fill="#a0522d"/><text x="48" y="58" text-anchor="middle" fill="#fff" font-size="28">2</text>
  <g transform="translate(120,40) scale(.92)">
    <use href="#nb"/>
    <use href="#band" x="118" y="110"/><use href="#loop" x="118" y="105"/>
  </g>
  <path d="M385,175 L385,110" stroke="#c0612b" stroke-width="7" marker-end="url(#ar)"/>
  <path d="M385,215 L385,280" stroke="#c0612b" stroke-width="7" marker-end="url(#ar)"/>
  <text x="40" y="365">Deslize até a altura</text>
  <text x="40" y="400">que preferir.</text>
  <text x="40" y="435" font-weight="500" font-size="23" fill="#6b5847">Ele fica firme na capa.</text>
</g>

<g transform="translate(50,745)">
  <rect width="475" height="480" rx="28" fill="#fff" stroke="#e7dccd" stroke-width="2"/>
  <circle cx="48" cy="48" r="27" fill="#a0522d"/><text x="48" y="58" text-anchor="middle" fill="#fff" font-size="28">3</text>
  <g transform="translate(120,40) scale(.92)">
    <use href="#nb"/>
    <use href="#band" x="118" y="150"/>
    <use href="#pen" x="118" y="-30"/>
    <use href="#loop" x="118" y="145"/>
  </g>
  <path d="M75,95 L75,175" stroke="#c0612b" stroke-width="7" marker-end="url(#ar)"/>
  <text x="40" y="365">Coloque a caneta</text>
  <text x="40" y="400">dentro do anel.</text>
  <text x="40" y="435" font-weight="500" font-size="23" fill="#6b5847">Empurre até ela ficar presa.</text>
</g>

<g transform="translate(555,745)">
  <rect width="475" height="480" rx="28" fill="#fff" stroke="#e7dccd" stroke-width="2"/>
  <circle cx="48" cy="48" r="27" fill="#a0522d"/><text x="48" y="58" text-anchor="middle" fill="#fff" font-size="28">4</text>
  <g transform="translate(120,40) scale(.92)">
    <use href="#nb"/>
    <use href="#band" x="118" y="110"/>
    <use href="#pen" x="118" y="30"/>
    <use href="#loop" x="118" y="105"/>
  </g>
  <circle cx="400" cy="90" r="34" fill="#4c9a5b"/>
  <path d="M383,90 L396,103 L418,79" fill="none" stroke="#fff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="40" y="365">Pronto! Feche e leve</text>
  <text x="40" y="400">para onde for.</text>
  <text x="40" y="435" font-weight="500" font-size="23" fill="#6b5847">Sua caneta sempre à mão.</text>
</g>
</g>

<rect x="50" y="1250" width="980" height="66" rx="33" fill="#a0522d"/>
<text x="540" y="1292" text-anchor="middle" font-size="24" font-weight="600" fill="#fff">Serve em agendas, planners e cadernos</text>
</svg></body></html>
