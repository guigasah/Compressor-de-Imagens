<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Cinzel:wght@600;700&display=swap" rel="stylesheet">
<style>
html,body{margin:0}
.c{width:1000px;height:1000px;position:relative;overflow:hidden;
 background:radial-gradient(circle at 50% 52%,#fffdf6 0%,#fbf1d9 45%,#efdcb0 100%)}
.b1{position:absolute;inset:14px;border:6px solid #b8892c;border-radius:30px}
.b2{position:absolute;inset:32px;border:2px solid #d9bd73;border-radius:20px}

.sub small{display:block;font-family:'Cinzel',serif;font-weight:600;font-size:23px;color:#a0742a;margin-top:8px;letter-spacing:3px}
svg.t{position:absolute;left:50%;top:205px;transform:translateX(-50%);width:640px;height:640px}

 </g>
